<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 女友 · 智谱 GLM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f472b6'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 23s-7-4.35-7-9a4 4 0 017-2.65A4 4 0 0123 14c0 4.65-7 9-7 9z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/vendor/highlight-theme.css" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="app" id="app">
  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-logo" id="brandLogo">💕</span>
        <span class="brand-text"><strong>AI 女友</strong><small id="brandSub">智谱 GLM</small></span>
      </div>
      <button class="btn-new" id="newChatBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        认识新的她
      </button>
    </div>

    <div class="conv-list" id="convList"></div>

    <div class="sidebar-foot">
      <button class="foot-btn" id="settingsBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 7 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3 15a1.65 1.65 0 0 0-1.51-1H1.4a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 3 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 7 4.6h.09A1.65 1.65 0 0 0 8.6 3V2.9a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 14.6 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1h.09a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
      <div class="conn" id="connState"><i class="dot"></i><span>检查中…</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ============ 对话区 ============ -->
  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn only-mobile" id="menuBtn" title="会话列表">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="partner-avatar" id="partnerAvatar">💕</span>
      <div class="title-wrap">
        <h1 id="chatTitle" title="双击可重命名">新对话</h1>
        <div class="partner-tags">
          <span class="badge" id="personaBadge">未设定</span>
          <span class="badge ghost" id="modelBadge" title="实际使用的模型">—</span>
        </div>
      </div>
      <div class="head-actions">
        <button class="btn-soft" id="editPersonaBtn" title="更换性格或名字">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          换一个她
        </button>
        <button class="icon-btn" id="clearBtn" title="清空聊天记录">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        </button>
        <button class="icon-btn" id="exportBtn" title="导出聊天记录">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        </button>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <button class="to-bottom" id="toBottom" hidden title="回到底部">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="send" id="sendBtn" title="发送">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 8 6 8z"/></svg>
        </button>
        <button class="send stop" id="stopBtn" hidden title="停止生成">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="composer-foot">
        <label class="mini-field">
          <span>模型</span>
          <select id="modelSelect"></select>
        </label>
        <span class="token-info" id="tokenInfo"></span>
      </div>
    </div>
  </main>

  <!-- ============ 人设向导 ============ -->
  <div class="setup" id="setup" hidden>
    <div class="setup-glow" aria-hidden="true"></div>
    <div class="setup-card">
      <div class="setup-steps" id="setupSteps"><i class="on"></i><i></i></div>

      <!-- 第一步：选性格 -->
      <section class="setup-step" data-step="1">
        <h2>先选一个她</h2>
        <p class="setup-sub">性格决定她怎么跟你说话，之后随时能换</p>
        <div class="persona-grid" id="personaGrid"></div>
      </section>

      <!-- 第二步：起名字 -->
      <section class="setup-step" data-step="2" hidden>
        <div class="picked" id="pickedPreview">
          <span class="picked-emoji">💕</span>
          <span class="picked-text"><b></b><small></small></span>
        </div>
        <h2>给她起个名字</h2>
        <p class="setup-sub">以后她就用这个名字和你说话了</p>
        <input id="partnerName" class="name-input" type="text" maxlength="12" autocomplete="off" placeholder="写下她的名字…" />
        <div class="name-suggest" id="nameSuggest"></div>
        <div class="setup-actions">
          <button class="btn-ghost" id="setupBack">上一步</button>
          <button class="btn-primary" id="setupDone">开始和她聊天</button>
        </div>
      </section>
    </div>
  </div>

  <!-- ============ 设置抽屉 ============ -->
  <div class="drawer" id="settingsDrawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>设置</h2>
      <button class="icon-btn" id="closeSettings" title="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div class="field">
        <span class="field-label">当前女友</span>
        <div class="current-partner" id="currentPartner">
          <span class="cp-emoji">💕</span>
          <span class="cp-text"><b>—</b><small>—</small></span>
          <button class="btn-ghost small" id="changePersonaBtn">更换</button>
        </div>
      </div>

      <label class="field">
        <span class="field-label">额外要求<small>会追加在性格设定后面，比如「多问我工作的事」</small></span>
        <textarea id="systemPrompt" rows="3" placeholder="留空即可，她只按性格来"></textarea>
      </label>

      <label class="field">
        <span class="field-label">深度思考<small>GLM-4.7-Flash 是推理模型，开启后先产出思维链再给答案</small></span>
        <label class="switch">
          <input type="checkbox" id="thinkingToggle" />
          <span class="slider"></span>
          <span class="switch-text">开启并展示思考过程（更慢、更烧 token）</span>
        </label>
      </label>

      <label class="field">
        <span class="field-label">温度 <b id="tempValue">0.9</b><small>越高越随性，越低越克制</small></span>
        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.9" />
      </label>

      <label class="field">
        <span class="field-label">最大回复长度（tokens）<small>聊天建议 512~2048</small></span>
        <input type="number" id="maxTokens" min="128" max="8192" step="128" value="1024" />
      </label>

      <div class="field">
        <span class="field-label">上游连接</span>
        <div class="probe-row">
          <button class="btn-ghost" id="probeBtn">测试连接</button>
          <span class="probe-result" id="probeResult"></span>
        </div>
        <p class="hint" id="endpointHint"></p>
      </div>

      <div class="field">
        <span class="field-label">危险操作</span>
        <button class="btn-danger" id="wipeBtn">清空全部会话</button>
      </div>

      <p class="hint">API Key 只保存在后端 <code>.env</code> 中，浏览器拿不到；聊天记录只存在这台电脑的浏览器里。</p>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
</div>

<script src="/vendor/axios.min.js"></script>
<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/js/markdown.js"></script>
<script src="/js/store.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
