[package]
name = "gravity-flip"
version = "1.0.0"
description = "翻转引力 - 一个重力翻转平台跳跃游戏"
authors = ["act666"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# 连字符在 Rust 标识符里非法，所以 lib 名用下划线；main.rs 里按这个名字引用
name = "gravity_flip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
